version: 4
kind: ceratops-sdlc

repository:
  capabilities:
    python:
      executable: python
      version-from:
        file: scripts/pyproject.toml
        key: project.requires-python
    node:
      executable: node
      channel: lts
      includes: [npm]
    git:
      executable: git
    uv:
      executable: uv
    ripgrep:
      executable: rg
    powershell:
      executable: powershell
      platforms: [windows]
  actions:
    bootstrap:
      requires:
        capabilities: [uv, node]
      steps:
        - run: [uv, sync, --project, scripts, --locked]
        # Resolve npm.cmd on Windows and npm on other platforms.
        - run: [uv, run, --project, scripts, --locked, python, -c, "import shutil, subprocess; subprocess.run([shutil.which('npm'), '--prefix', 'scripts', 'ci'], check=True)"]
    test-selection:
      requires:
        capabilities: [uv]
      parameters: [base, head]
      steps:
        - run: [uv, run, --locked, scripts/testing/run-tests.py, --select-only, --base, "{base}", --head, "{head}"]
    validate:
      requires:
        capabilities: [uv]
      steps:
        - run: [uv, run, --locked, scripts/validate-repository.py]
    test:
      requires:
        capabilities: [uv]
      steps:
        - run: [uv, run, --locked, scripts/testing/run-tests.py, --auto]

deliverables:
  mcp-servers:
    ceratops-mcp-server-manager:
      source: mcp-servers/ceratops_mcp_server_manager
      manifest: mcp-servers/ceratops_mcp_server_manager/mcp-server.json
      prerequisites: []
      actions:
        validate:
          requires:
            capabilities: []
          no-op: Repository validation covers the MCP server manager source and manifest.
        install:
          requires:
            capabilities: [uv]
          steps:
            - run: [uv, run, --locked, scripts/deploy-mcp-server-manager.py]

  skills:
    ceratops-automation-run:
      source: skills/ceratops-automation-run
      prerequisites: []
      actions:
        validate:
          requires:
            capabilities: []
          steps:
            - handoff:
                lifecycle: ceratops-skill-lifecycle
                action: source-validate
                inputs:
                  skill: ceratops-automation-run
        install:
          requires:
            capabilities: []
          steps:
            - handoff:
                lifecycle: ceratops-skill-lifecycle
                action: deploy
                inputs:
                  skill: ceratops-automation-run
    ceratops-code-consistency-audit:
      source: skills/ceratops-code-consistency-audit
      prerequisites: []
      actions:
        validate:
          requires: {capabilities: []}
          steps: [{handoff: {lifecycle: ceratops-skill-lifecycle, action: source-validate, inputs: {skill: ceratops-code-consistency-audit}}}]
        install:
