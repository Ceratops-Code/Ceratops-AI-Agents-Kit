version: 5
kind: ceratops-sdlc

repository:
  tools:
    python:
      executable: python
      version-from:
        file: scripts/pyproject.toml
        key: project.requires-python
    node:
      executable: node
      version-from:
        file: scripts/.nvmrc
      includes:
        - npm
    git:
      executable: git
    uv:
      executable: uv
    ripgrep:
      executable: rg
    powershell:
      executable: powershell
      platforms:
        - windows
    npm:
      executable: npm
  actions:
    bootstrap:
      requires:
        tools:
          - uv
          - node
          - npm
      steps:
        - run: [uv, sync, --project, scripts, --locked]
        # Resolve npm.cmd on Windows and npm on other platforms.
        - run: [npm, ci, --prefix, scripts]
    test-selection:
      requires:
        tools:
          - uv
      parameters:
        - base
        - head
      steps:
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - scripts/testing/run-tests.py
            - --select-only
            - --base
            - '{base}'
            - --head
            - '{head}'
    pre-build-checks:
      check-groups:
        npm-markdown-lint:
          requires:
            tools:
              - node
              - npm
          validation-tools:
            - npm-markdown-lint
          check-results:
            result-owner: operation
            product-inputs:
              - '**/*.md'
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/package.json
              - scripts/.markdownlint.json
            dependencies:
              - scripts/package-lock.json
            tools:
              - node
              - npm
          steps:
            - run: [npm, --prefix, scripts, run, lint:markdown]
        actionlint:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - actionlint
          check-results:
            result-owner: operation
            product-inputs:
              - .github/workflows/*.yml
              - .github/workflows/*.yaml
              - .github/actions/**
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - scripts/run-actionlint.py
              - .github/actionlint.yaml
              - .github/actionlint.yml
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
              - GITHUB_EVENT_NAME
              - GITHUB_EVENT_PATH
              - GITHUB_ACTIONS
            tools:
              - uv
              - python
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/run-actionlint.py]
        yaml-lint:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - yaml-lint
          check-results:
            result-owner: operation
            product-inputs:
              - '**/*.yaml'
              - '**/*.yml'
              - skills/ceratops-repo-lifecycle/references/templates/sdlc.yml.tmpl
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - scripts/.yamllint.yml
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
            tools:
              - uv
              - python
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - -m
                - yamllint
                - --config-file
                - scripts/.yamllint.yml
                - .
                - skills/ceratops-repo-lifecycle/references/templates/sdlc.yml.tmpl
        ruff:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - ruff
          check-results:
            result-owner: operation
            product-inputs:
              - scripts/**/*.py
              - mcp-servers/**/*.py
              - skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - .gitignore
              - '**/.gitignore'
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
            tools:
              - uv
              - python
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - -m
                - ruff
                - check
                - --config
                - scripts/pyproject.toml
                - scripts
                - mcp-servers
                - skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl
        mypy-linux:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - mypy
          check-results:
            result-owner: operation
            product-inputs:
              - skills/**/*.py
              - tests/**/*.py
              - mcp-servers/**/*.py
              - '**/*.pyi'
              - skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - .gitignore
              - '**/.gitignore'
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
              - MYPYPATH
            tools:
              - uv
              - python
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - -m
                - mypy
                - --config-file
                - scripts/pyproject.toml
                - --platform
                - linux
        mypy-windows:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - mypy
          check-results:
            result-owner: operation
            product-inputs:
              - skills/**/*.py
              - tests/**/*.py
              - mcp-servers/**/*.py
              - '**/*.pyi'
              - skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - .gitignore
              - '**/.gitignore'
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
              - MYPYPATH
            tools:
              - uv
              - python
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - -m
                - mypy
                - --config-file
                - scripts/pyproject.toml
                - --platform
                - win32
        tests:
          check-results:
            product-inputs:
              - skills/**
              - tools/**
              - mcp-servers/**
              - sdlc/**
              - docs/result_records.py.tmpl
              - README.md
              - AGENTS.md
              - .github/**
            check-inputs:
              - scripts/**
              - tests/**
            dependencies:
              - scripts/uv.lock
              - scripts/package-lock.json
            environment:
              - PATH
              - CI
              - PYTEST_ADDOPTS
              - GITHUB_ACTIONS
              - GITHUB_EVENT_NAME
              - GITHUB_EVENT_PATH
              - GITHUB_REF_NAME
              - UV_OFFLINE
            tools:
              - uv
              - git
              - node
              - npm
              - powershell
          requires:
            tools:
              - uv
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/testing/run-tests.py, --auto]

deliverables:
  mcp-servers:
    ceratops-mcp-server-manager:
      root-dir: mcp-servers/ceratops_mcp_server_manager
      manifest: mcp-servers/ceratops_mcp_server_manager/mcp-server.json
      build-after: []
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                tools: []
              no-op: Repository validation covers the MCP server manager source and manifest.
            tests:
              requires:
                tools: []
              no-op: Repository tests cover managed launchers, selection changes, and version retirement.
        install:
          requires:
            tools:
              - uv
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/deploy-mcp-server-manager.py]

    source_search_mcp:
      root-dir: tools
      manifest: tools/mcp-server.json
      build-after: []
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                tools: []
              no-op: Repository checks cover source-search inputs; the MCP installer checks the locked candidate before activation.
            tests:
              requires:
                tools: []
              no-op: Repository tests cover bounded source-search behavior and MCP packaging.
        install:
          requires:
            tools: []
          steps:
            - handoff:
                lifecycle: ceratops-mcp-server-lifecycle
                action: install
                inputs:
                  mcp-server: source_search_mcp

  skills:
    ceratops-automation-run:
      root-dir: skills/ceratops-automation-run
      build-after: []
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                tools: []
              steps:
                - handoff:
                    lifecycle: ceratops-skill-lifecycle
                    action: source-validate
                    inputs:
                      skill: ceratops-automation-run
        install:
          requires:
            tools: []
          steps:
            - handoff:
                lifecycle: ceratops-skill-lifecycle
                action: deploy
                inputs:
