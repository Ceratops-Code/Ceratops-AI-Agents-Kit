version: 4
kind: ceratops-sdlc

repository:
  capabilities:
    python:
      executable: python
      version-from:
        file: scripts/pyproject.toml
        key: project.requires-python
    node:
      executable: node
      version-from:
        file: scripts/.nvmrc
      includes: [npm]
    git:
      executable: git
    uv:
      executable: uv
    ripgrep:
      executable: rg
    powershell:
      executable: powershell
      platforms: [windows]
  actions:
    bootstrap:
      requires:
        capabilities: [uv, node]
      steps:
        - run: [uv, sync, --project, scripts, --locked]
        # Resolve npm.cmd on Windows and npm on other platforms.
        - run: [uv, run, --project, scripts, --locked, python, -c, "import shutil, subprocess; subprocess.run([shutil.which('npm'), '--prefix', 'scripts', 'ci'], check=True)"]
    test-selection:
      requires:
        capabilities: [uv]
      parameters: [base, head]
      steps:
        - run: [uv, run, --project, scripts, --locked, python, scripts/testing/run-tests.py, --select-only, --base, "{base}", --head, "{head}"]
    pre-build-checks:
      check-groups:
        source:
          check-results:
            product-inputs: ["**"]
            check-inputs: [scripts/validate-repository.py, scripts/result_records.py, skills/ceratops-repo-lifecycle/references/contracts/**, skills/ceratops-repo-lifecycle/scripts/ceratops_repo_compatibility_engine/**]
            dependencies: [scripts/uv.lock, scripts/package-lock.json]
            environment: [PATH, CI, GITHUB_ACTIONS, UV_OFFLINE]
            tools: [uv, git, node, npm, powershell]
          requires:
            capabilities: [uv]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/validate-repository.py]
        tests:
          check-results:
            product-inputs: [skills/**, tools/**, mcp-servers/**, sdlc/**, docs/result_records.py.tmpl, README.md, AGENTS.md, .github/**]
            check-inputs: [scripts/**, tests/**]
            dependencies: [scripts/uv.lock, scripts/package-lock.json]
            environment: [PATH, CI, PYTEST_ADDOPTS, GITHUB_ACTIONS, GITHUB_EVENT_NAME, GITHUB_EVENT_PATH, GITHUB_REF_NAME, UV_OFFLINE]
            tools: [uv, git, node, npm, powershell]
          requires:
            capabilities: [uv]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/testing/run-tests.py, --auto]

deliverables:
  mcp-servers:
    ceratops-mcp-server-manager:
      root-dir: mcp-servers/ceratops_mcp_server_manager
      manifest: mcp-servers/ceratops_mcp_server_manager/mcp-server.json
      build-after: []
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                capabilities: []
              no-op: Repository validation covers the MCP server manager source and manifest.
            tests:
              requires:
                capabilities: []
              no-op: Repository tests cover managed launchers, selection changes, and version retirement.
        install:
          requires:
            capabilities: [uv]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/deploy-mcp-server-manager.py]

    source_search_mcp:
      root-dir: tools
      manifest: tools/mcp-server.json
      build-after: []
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                capabilities: []
              no-op: Repository checks cover source-search inputs; the MCP installer checks the locked candidate before activation.
            tests:
              requires:
                capabilities: []
              no-op: Repository tests cover bounded source-search behavior and MCP packaging.
        install:
          requires:
            capabilities: []
          steps:
            - handoff:
                lifecycle: ceratops-mcp-server-lifecycle
                action: install
                inputs:
                  mcp-server: source_search_mcp

  skills:
    ceratops-automation-run:
      root-dir: skills/ceratops-automation-run
      build-after: []
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                capabilities: []
              steps:
                - handoff:
                    lifecycle: ceratops-skill-lifecycle
                    action: source-validate
                    inputs:
                      skill: ceratops-automation-run
        install:
          requires:
            capabilities: []
          steps:
            - handoff:
                lifecycle: ceratops-skill-lifecycle
                action: deploy
                inputs:
                  skill: ceratops-automation-run
    ceratops-code-consistency-audit:
      root-dir: skills/ceratops-code-consistency-audit
      build-after: []
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires: {capabilities: []}
              steps: [{handoff: {lifecycle: ceratops-skill-lifecycle, action: source-validate, inputs: {skill: ceratops-code-consistency-audit}}}]
        install:
          requires: {capabilities: []}
          steps: [{handoff: {lifecycle: ceratops-skill-lifecycle, action: deploy, inputs: {skill: ceratops-code-consistency-audit}}}]
