# Development repository only; do not expose this service to Forms.
[mcp_servers.ceratops_mcp_server_manager]
command = 'cmd.exe'
args = [
  '/d',
  '/s',
  '/c',
  '""%USERPROFILE%\.codex\mcp\ceratops_mcp_server_manager\bin\ceratops_mcp_server_manager.cmd" --mcp"',
]
enabled_tools = ['install', 'update', 'versions']
startup_timeout_sec = 20
tool_timeout_sec = 300
