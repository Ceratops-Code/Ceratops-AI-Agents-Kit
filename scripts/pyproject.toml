[project]
name = "ceratops-ai-agents-kit-tooling"
version = "0.0.0"
requires-python = "==3.14.9"
dependencies = [
  "filelock==4.2.9",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "markdown-it-py==4.2.0",
  "packaging==26.3",
  "tzdata==2026.6",
  "tomlkit==0.15.2",
  "psutil==7.2.2",
]

[dependency-groups]
dev = ["mcp==2.3.0", "mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.5", "yamllint==1.38.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["../tools", "../mcp-servers/ceratops_mcp_server_manager"]

[tool.ceratops.test-support]
managed = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
  "E", "F", "I", "B",
  # Credentials, disabled HTTPS checks, and shell execution.
  "S105", "S106", "S107", "S501", "S602", "S604", "S605",
  # Blocking network, process, filesystem, input, and sleep calls in async code.
  "ASYNC210", "ASYNC212", "ASYNC220", "ASYNC221", "ASYNC222",
  "ASYNC230", "ASYNC240", "ASYNC250", "ASYNC251",
  "DTZ003", "DTZ004", "DTZ005", "DTZ006", "UP", "RUF100",
]
ignore = ["E501"]

[tool.mypy]
files = [
  "skills",
  "tests",
  "mcp-servers",
  "skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
