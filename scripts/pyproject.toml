[project]
name = "ceratops-ai-agents-kit-tooling"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "filelock==4.0.8",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "markdown-it-py==4.2.0",
  "mcp==2.2.0",
  "mypy==2.3.1",
  "packaging==26.3",
  "pytest==9.1.1",
  "ruff==0.16.9",
  "tzdata==2026.5",
  "yamllint==1.38.0"
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
files = [
  "skills",
  "tests",
  "mcp-servers",
  "skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
