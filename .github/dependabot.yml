version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/local
    schedule:
      interval: weekly
    groups:
      codeql-action-version-updates:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
    labels:
      - dependencies
      - github-actions
  - package-ecosystem: npm
    directory: /scripts
    target-branch: release/local
    schedule:
      interval: weekly
    labels:
      - dependencies
      - npm
  - package-ecosystem: uv
    directory: /scripts
    target-branch: release/local
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      codeql-action-security-updates:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
    labels:
      - dependencies
      - github-actions
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - npm
  - package-ecosystem: uv
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - python
