name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release/local
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check pull request source for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$PR_HEAD_BRANCH" != release/local || "$PR_HEAD_REPO" != "$PR_BASE_REPO" ]]; then
            echo "::error::Pull requests to main must come from this repository's release/local."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install ripgrep for repository tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install development validators
        run: |
          uv sync --project scripts --locked
          npm --prefix scripts ci

      - name: Run repository checks
        shell: bash
        env:
          CERATOPS_PROJECTS_ROOT: ${{ github.workspace }}/..
          CERATOPS_TASK_TEMP_ROOT: ${{ runner.temp }}
        run: |
          npm --prefix scripts run lint:markdown 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python scripts/run-actionlint.py 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python -m yamllint --config-file scripts/.yamllint.yml . skills/ceratops-repo-lifecycle/references/templates/sdlc.yml.tmpl 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python -m ruff check --config scripts/pyproject.toml scripts mcp-servers skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python -m mypy --config-file scripts/pyproject.toml --platform linux 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python -m mypy --config-file scripts/pyproject.toml --platform win32 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python scripts/testing/run-tests.py --auto 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"

      - name: Set up Node.js for Renovate configuration checks
        id: renovate_node
        if: >-
          hashFiles('renovate.json', 'renovate.jsonc', 'renovate.json5',
          '.github/renovate.json', '.github/renovate.jsonc', '.github/renovate.json5',
          '.renovaterc', '.renovaterc.json', '.renovaterc.jsonc', '.renovaterc.json5',
          'org-inherited-config.json') != '' ||
          (github.event.repository.name == 'renovate-config' &&
          hashFiles('**/*.json', '**/*.jsonc', '**/*.json5') != '')
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26.13.1'

      - name: Check Renovate configuration
        if: steps.renovate_node.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          config_files=()
          repository="${GITHUB_REPOSITORY:-}"
          # Preset repositories own their tracked JSON-family files.
          if [[ "${repository##*/}" == renovate-config || -f org-inherited-config.json ]]; then
            while IFS= read -r -d '' config_file; do
              config_files+=("$config_file")
            done < <(git ls-files -z -- '*.json' '*.jsonc' '*.json5')
            wait "$!"
          else
            for config_file in renovate.json renovate.jsonc renovate.json5 \
              .github/renovate.json .github/renovate.jsonc .github/renovate.json5 \
              .renovaterc .renovaterc.json .renovaterc.jsonc .renovaterc.json5; do
              if [[ -f "$config_file" ]]; then
                config_files+=("$config_file")
              fi
            done
          fi
          if [[ "${#config_files[@]}" -eq 0 ]]; then
            echo "No repository-owned Renovate configuration files."
            exit 0
          fi
          for config_file in "${config_files[@]}"; do
            if [[ "$config_file" == *.json ]]; then
              node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8").replace(/^\uFEFF/, ""))' "$config_file"
            fi
          done
          # This offline check does not inspect Mend jobs or fetch private presets.
          npm exec --yes --package=renovate@44.240.0 -- \
            renovate-config-validator --no-global --strict "${config_files[@]}"

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/repository-validation.log
            .build/deploy-validation/repository-validation.log
            .build/test-diagnostics/pytest-failure.json
