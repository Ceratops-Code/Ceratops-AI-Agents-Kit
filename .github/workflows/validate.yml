name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install ripgrep for repository tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install development validators
        run: |
          uv sync --project scripts --locked
          npm --prefix scripts ci

      - name: Validate and test through SDLC
        uses: ./skills/ceratops-repo-lifecycle/scripts
        env:
          CERATOPS_PROJECTS_ROOT: ${{ github.workspace }}/..
          CERATOPS_TASK_TEMP_ROOT: ${{ runner.temp }}
        with:
          repo-root: .
          evidence-file: ${{ runner.temp }}/sdlc-validation.json

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/sdlc-validation.json
            .build/deploy-validation/repository-validation.log
            .build/test-diagnostics/pytest-failure.json
