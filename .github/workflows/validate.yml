name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install ripgrep for repository tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install development validators
        run: |
          uv sync --project scripts --locked
          npm --prefix scripts ci

      - name: Validate and test through SDLC
        uses: ./skills/ceratops-repo-lifecycle/scripts
        with:
          repo-root: .
          evidence-file: ${{ runner.temp }}/sdlc-validation.json

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/sdlc-validation.json
            .build/deploy-validation/repository-validation.log
            .build/test-diagnostics/pytest-failure.json
