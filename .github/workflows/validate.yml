name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release/local
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check pull request source for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$PR_HEAD_BRANCH" != release/local || "$PR_HEAD_REPO" != "$PR_BASE_REPO" ]]; then
            echo "::error::Pull requests to main must come from this repository's release/local."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install ripgrep for repository tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install development validators
        run: |
          uv sync --project scripts --locked
          npm --prefix scripts ci

      - name: Run repository checks
        shell: bash
        env:
          CERATOPS_PROJECTS_ROOT: ${{ github.workspace }}/..
          CERATOPS_TASK_TEMP_ROOT: ${{ runner.temp }}
        run: |
          npm --prefix scripts run lint:markdown 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python scripts/run-actionlint.py 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python -m yamllint --config-file scripts/.yamllint.yml . skills/ceratops-repo-lifecycle/references/templates/sdlc.yml.tmpl 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python -m ruff check --config scripts/pyproject.toml scripts mcp-servers skills/ceratops-repo-lifecycle/references/templates/deploy-skills.py.tmpl 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python -m mypy --config-file scripts/pyproject.toml --platform linux 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python -m mypy --config-file scripts/pyproject.toml --platform win32 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"
          uv run --project scripts --locked python scripts/testing/run-tests.py --auto 2>&1 | tee -a "$RUNNER_TEMP/repository-validation.log"

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/repository-validation.log
            .build/deploy-validation/repository-validation.log
            .build/test-diagnostics/pytest-failure.json
