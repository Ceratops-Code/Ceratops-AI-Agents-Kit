[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ceratops_mcp_server_manager"
version = "0.4.6"
description = "Independent local MCP server packaging, installation, updates, and version inspection"
requires-python = ">=3.14,<3.15"
dependencies = ["mcp==2.3.0", "packaging==26.3"]

[project.scripts]
ceratops_mcp_server_manager = "ceratops_mcp_server_manager.cli:main"

[tool.hatch.build.targets.wheel]
include = ["/*.py"]

[tool.hatch.build.targets.wheel.sources]
"" = "ceratops_mcp_server_manager"
