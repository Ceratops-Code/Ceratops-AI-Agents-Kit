---
name: Ceratops repository checks
description: Run explicitly named SDLC check phases or groups through the lifecycle.
inputs:
  repo-root:
    description: Repository root containing sdlc/sdlc.yml.
    required: true
  evidence-file:
    description: Failure evidence path owned by the caller.
    required: true
  operations:
    description: Complete SDLC check-phase or group locations, one per line.
    required: true
runs:
  using: composite
  steps:
    - name: Run SDLC checks
      shell: bash
      env:
        CERATOPS_ACTION_ROOT: ${{ github.action_path }}
        CERATOPS_REPOSITORY: ${{ inputs.repo-root }}
        CERATOPS_EVIDENCE: ${{ inputs.evidence-file }}
        CERATOPS_CHECK_OPERATIONS: ${{ inputs.operations }}
      run: |
        : "${CERATOPS_EVIDENCE:?evidence-file input is required}"
        : "${CERATOPS_CHECK_OPERATIONS:?operations input is required}"
        set -- --ci
        while IFS= read -r operation || [ -n "$operation" ]; do
          operation="${operation%$'\r'}"
          [ -z "$operation" ] && continue
          case "$operation" in
            *.actions.before-build-checks|*.actions.before-build-checks.check-groups.*|*.actions.after-build-checks|*.actions.after-build-checks.check-groups.*)
              set -- "$@" --operation "$operation" ;;
            *) echo "Expected an SDLC check phase or group: $operation" >&2; exit 2 ;;
          esac
        done <<< "$CERATOPS_CHECK_OPERATIONS"
        [ "$#" -gt 1 ] || { echo "operations must name at least one check" >&2; exit 2; }
        uv run --quiet --locked \
          --project "$CERATOPS_ACTION_ROOT/../../../scripts" \
          python "$CERATOPS_ACTION_ROOT/repository_operation.py" \
          --repo-root "${CERATOPS_REPOSITORY:?repo-root input is required}" \
          "$@" \
          --evidence-file "$CERATOPS_EVIDENCE"
